<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Electribe 2 — Pattern Change</title>
<style>
  :root {
    --orange: #ff6b35;
    --orange-dim: #cc5529;
    --bg: #0a0a0a;
    --surface: #151515;
    --border: #282828;
    --text: #e0e0e0;
    --muted: #666;
    --green: #4caf50;
    --red: #ff3333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Header ─────────────────────────────────────── */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 0;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    flex-direction: column;
  }

  .header-left h1 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--orange);
  }

  .header-left .sub {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-top: 1px;
  }

  .conn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 16px;
    font-size: 0.55rem;
    letter-spacing: 0.5px;
    transition: all 0.3s;
  }

  .conn .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .conn.ok { background: rgba(76, 175, 80, 0.1); }
  .conn.ok .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .conn.err { background: rgba(255, 51, 51, 0.1); }
  .conn.err .dot { background: var(--red); }

  .conn .name {
    color: var(--muted);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Display ────────────────────────────────────── */

  .display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    min-height: 0;
    gap: 4px;
  }

  .pattern-num {
    font-size: clamp(5rem, 28vw, 10rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--orange);
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255, 107, 53, 0.2);
    transition: color 0.15s;
  }

  .pattern-num.sending { color: var(--green); }

  .pattern-num.error {
    color: var(--red);
    animation: shake 0.3s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .send-hint {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── Bottom Section ─────────────────────────────── */

  .bottom {
    flex-shrink: 0;
    padding: 0 10px 20px;
  }

  /* ── Quick Jumps ────────────────────────────────── */

  .quick {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
  }

  .quick button {
    padding: 8px 0;
    width: 52px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }

  .quick button:active {
    background: #1e1e1e;
    color: var(--text);
  }

  .quick button:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ── Numpad ─────────────────────────────────────── */

  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 360px;
    margin: 0 auto;
  }

  .key {
    height: 58px;
    border: none;
    border-radius: 12px;
    font-size: 1.5rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .key:active { transform: scale(0.94); }

  .key-num {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .key-num:active { background: #1e1e1e; }

  .key-del {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 1.2rem;
  }

  .key-del:active { background: #1e1e1e; }

  .key-send {
    background: var(--orange);
    color: #0a0a0a;
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
  }

  .key-send:active { background: var(--orange-dim); }

  .key-send:disabled {
    background: #1a1a1a;
    color: #333;
    cursor: not-allowed;
  }

  .key-send:disabled:active { transform: none; }

  /* ── Toast ──────────────────────────────────────── */

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 100;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.ok { background: rgba(76, 175, 80, 0.92); color: #fff; }
  .toast.err { background: rgba(255, 51, 51, 0.92); color: #fff; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>Electribe 2</h1>
      <div class="sub">Pattern Change — USB MIDI</div>
    </div>
    <div class="conn" id="conn">
      <div class="dot"></div>
      <span class="name" id="conn-name">Connecting...</span>
    </div>
  </div>

  <div class="display">
    <div class="pattern-num" id="display">---</div>
    <div class="send-hint" id="send-hint">Tap a number</div>
  </div>

  <div class="bottom">
    <div class="quick" id="quick">
      <button onclick="jumpTo(1)">001</button>
      <button onclick="jumpTo(33)">033</button>
      <button onclick="jumpTo(65)">065</button>
      <button onclick="jumpTo(97)">097</button>
      <button onclick="jumpTo(129)">129</button>
      <button onclick="jumpTo(200)">200</button>
    </div>

    <div class="numpad-grid">
      <button class="key key-num" data-val="1">1</button>
      <button class="key key-num" data-val="2">2</button>
      <button class="key key-num" data-val="3">3</button>
      <button class="key key-num" data-val="4">4</button>
      <button class="key key-num" data-val="5">5</button>
      <button class="key key-num" data-val="6">6</button>
      <button class="key key-num" data-val="7">7</button>
      <button class="key key-num" data-val="8">8</button>
      <button class="key key-num" data-val="9">9</button>
      <button class="key key-del" id="btn-del">⌫</button>
      <button class="key key-num" data-val="0">0</button>
      <button class="key key-send" id="btn-send" disabled>GO</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  const display  = document.getElementById('display');
  const sendHint = document.getElementById('send-hint');
  const connEl   = document.getElementById('conn');
  const connName = document.getElementById('conn-name');
  const btnDel   = document.getElementById('btn-del');
  const btnSend  = document.getElementById('btn-send');
  const toastEl  = document.getElementById('toast');
  const quickBar = document.getElementById('quick');

  let currentInput = '';
  let midiAccess   = null;
  let output       = null;
  let sending      = false;

  // ── Display ──────────────────────────────────────

  function refreshDisplay() {
    if (currentInput === '') {
      display.textContent = '---';
      display.className = 'pattern-num';
      sendHint.textContent = 'Tap a number';
      btnSend.disabled = true;
    } else {
      const num = parseInt(currentInput, 10);
      display.textContent = String(num).padStart(3, '0');
      display.className = 'pattern-num';
      if (num >= 1 && num <= 250) {
        sendHint.textContent = 'Tap GO to send';
        btnSend.disabled = false;
      } else {
        sendHint.textContent = 'Range: 001 — 250';
        btnSend.disabled = true;
      }
    }
  }

  function flashDisplay(cls) {
    display.className = 'pattern-num ' + cls;
  }

  // ── Toast ────────────────────────────────────────

  let toastTimer = null;
  function showToast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast ' + type + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2000);
  }

  // ── Vibrate ──────────────────────────────────────

  function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  // ── MIDI ─────────────────────────────────────────

  async function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      connEl.className = 'conn err';
      connName.textContent = 'Web MIDI not supported';
      return;
    }
    try {
      midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      midiAccess.onstatechange = () => findDevice();
      findDevice();
    } catch {
      connEl.className = 'conn err';
      connName.textContent = 'MIDI access denied';
    }
  }

  function findDevice() {
    output = null;
    for (const [, port] of midiAccess.outputs) {
      const n = port.name.toLowerCase();
      if (n.includes('electribe') || n.includes('korg')) {
        output = port;
        break;
      }
    }
    if (output) {
      connEl.className = 'conn ok';
      connName.textContent = output.name;
      refreshDisplay();
      quickBar.querySelectorAll('button').forEach(b => b.disabled = false);
    } else {
      connEl.className = 'conn err';
      connName.textContent = 'Connect Electribe 2 via USB';
      btnSend.disabled = true;
      quickBar.querySelectorAll('button').forEach(b => b.disabled = true);
      const devs = [];
      for (const [, p] of midiAccess.outputs) devs.push(p.name);
      if (devs.length) connName.textContent += ' — ' + devs.join(', ');
    }
  }

  // ── Send MIDI ────────────────────────────────────

  function sendPC(patternNum) {
    if (!output || sending) return false;
    sending = true;

    const internal = patternNum - 1;
    const bank     = Math.floor(internal / 128);
    const program  = internal % 128;

    output.send([0xB0, 0x00, 0x00]);
    output.send([0xB0, 0x20, bank]);
    output.send([0xC0, program]);

    setTimeout(() => { sending = false; }, 150);
    return true;
  }

  // ── Send Action ──────────────────────────────────

  function doSend() {
    if (btnSend.disabled) return;

    const num = parseInt(currentInput, 10);
    if (isNaN(num) || num < 1 || num > 250) {
      flashDisplay('error');
      vibrate(80);
      showToast('Enter 001 — 250', 'err');
      return;
    }

    const d = String(num).padStart(3, '0');

    if (sendPC(num)) {
      flashDisplay('sending');
      vibrate(30);
      showToast('Pattern ' + d + ' sent', 'ok');
      setTimeout(() => {
        currentInput = '';
        refreshDisplay();
      }, 400);
    } else {
      showToast('Check MIDI connection', 'err');
    }
  }

  // ── Keypad Bindings ──────────────────────────────

  document.querySelectorAll('.key-num').forEach(btn => {
    btn.addEventListener('click', () => {
      if (currentInput.length >= 3) return;
      vibrate(15);
      currentInput += btn.dataset.val;
      refreshDisplay();
    });
  });

  btnDel.addEventListener('click', () => {
    vibrate(15);
    currentInput = currentInput.slice(0, -1);
    refreshDisplay();
  });

  btnSend.addEventListener('click', doSend);

  let delLong = null;
  btnDel.addEventListener('pointerdown', () => {
    delLong = setTimeout(() => {
      currentInput = '';
      refreshDisplay();
      vibrate(40);
    }, 500);
  });
  btnDel.addEventListener('pointerup', () => clearTimeout(delLong));
  btnDel.addEventListener('pointercancel', () => clearTimeout(delLong));

  window.jumpTo = function(n) {
    vibrate(20);
    currentInput = String(n);
    refreshDisplay();
    doSend();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9' && currentInput.length < 3) {
      currentInput += e.key;
      refreshDisplay();
    } else if (e.key === 'Backspace') {
      currentInput = currentInput.slice(0, -1);
      refreshDisplay();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      doSend();
    } else if (e.key === 'Escape') {
      currentInput = '';
      refreshDisplay();
    }
  });

  document.addEventListener('dblclick', (e) => e.preventDefault());

  initMIDI();
})();
</script>

</body>
</html>
